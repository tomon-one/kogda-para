name: Ошибка
description: Приложение, виджет или сайт работают не так, как написано
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issue видят все. Об уязвимости — не сюда, а по [SECURITY.md](https://github.com/tomon-one/kogda-para/blob/master/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Версия
      description: "Приложение: «Настройки», строка «Версия …». Сайт: «Настройки» → «О сайте»"
      placeholder: r-Алтай.1.0.0
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Телефон, система и браузер
      description: Браузер — если ошибка на сайте
      placeholder: Samsung Galaxy A52, Android 13 или iPhone 13, iOS 18, Safari
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что делали, что ожидали увидеть и что увидели. Скриншот можно перетащить сюда.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Сведения для отчёта
      description: >-
        «Настройки» → «О приложении» (на сайте — «О сайте») → «Сведения для
        отчёта» → скопировать.
        В них есть выбранная группа, а у преподавателя — его имя: если не хотите
        показывать их всем, пришлите сведения автору в Telegram.
      render: text
