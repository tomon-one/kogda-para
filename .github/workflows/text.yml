name: Открытый текст

# Основные тесты пропускают пуши с одними документами, а история в
# комментариях и ссылки на файлы приложения бывают и в README, и в docs/.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  text:
    name: Комментарии и ссылки
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -c server/constraints.txt pytest
      # Без conftest: ему нужна служба целиком, сторожу — только git и текст.
      - run: python -m pytest -q --noconftest server/tests/test_public_text.py
