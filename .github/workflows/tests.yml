name: Тесты

# Документы, картинки и описания тестам не нужны.
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  # Запустить вручную — после пуша, где были одни документы.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Служба
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/constraints.txt
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m pytest tests -q
      # Правила F: неизвестные имена, лишние импорты — ошибки, а не стиль.
      - run: python -m ruff check --select F,E9 src tests ../tools

  app:
    name: Приложение
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      # Юнит-тесты и сжатие R8, как у выпуска: ошибки правил R8 тесты не видят.
      # Подпись для этого шага не нужна.
      - run: ./gradlew :app:testDebugUnitTest :app:minifyReleaseWithR8
