# /etc/nginx/sites-enabled/whensclass.conf — ставит владелец.
# Журнал без сетевых адресов: в приложении обещано, что обращения
# ни с кем не связываются, и это должно быть правдой.
#
# И без группы и преподавателя в пути: /v1/teacher/<id> — это ФИО, а телефон
# преподавателя спрашивает свой путь почти каждый час, и 52 дня журнала
# выделяли его самого. Пишется шаблон пути.
map $uri $whensclass_path {
    ~^/v1/teacher/  /v1/teacher/*;
    ~^/v1/schedule/ /v1/schedule/*;
    default         $uri;
}
log_format whensclass '$time_iso8601 $request_method $whensclass_path $status $body_bytes_sent $request_time';

# Ограничения по адресу.
#
# Это защита от долбёжки: сорвавшегося скрипта, чужого качальщика, нашей же
# ошибки в цикле. От настоящего DDoS она не спасает — залитый канал отсюда не
# разгрести, для этого нужна фильтрация выше по пути.
#
# Пороги щедрые намеренно. Один телефон делает около десяти обращений в час, а у
# сотовых операторов десятки абонентов делят один публичный адрес: жадный порог
# отрубил бы их разом, и виноватым выглядело бы приложение.
limit_req_zone  $binary_remote_addr zone=whensclass_api:10m rate=120r/m;
limit_req_zone  $binary_remote_addr zone=whensclass_apk_req:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=whensclass_apk:10m;

# Расписание НГОК для приложения «Когда пара?».
# Служба слушает unix-сокет /run/whensclass/api.sock, наружу её пускает этот
# файл. Раньше — 127.0.0.1:8081, а непривилегированный порт на общей машине
# любая локальная учётка может занять, пока служба перезапускается, и nginx
# отдавал бы телефонам её ответы. Каталог сокета
# принадлежит службе: подложить туда свой не выйдет.
# Чужих сайтов конфиг не касается: свой server_name, свой upstream, свои логи.
server {
    listen 77.91.112.39:80;
    access_log off;
    error_log  /var/log/nginx/whensclass.error.log crit;
    server_name kogda-para-nsk.ru schedule.edelweiss-alpine-confederation.ru;

    # Проверка владения доменом — тем же способом, что у соседних сайтов.
    # Ограничений здесь нет намеренно: сюда ходит certbot, а не люди.
    location /.well-known/acme-challenge/ { root /var/www/acme; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 77.91.112.39:443 ssl;
    http2 on;
    server_name kogda-para-nsk.ru schedule.edelweiss-alpine-confederation.ru;

    # Один сертификат на оба имени. Прежнее имя — для сборок 1–2, которые
    # ходят на него; убрать, когда все обновятся.
    ssl_certificate     /etc/letsencrypt/live/kogda-para-nsk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kogda-para-nsk.ru/privkey.pem;

    access_log /var/log/nginx/whensclass.access.log whensclass;
    error_log  /var/log/nginx/whensclass.error.log crit;

    # Только https: без HSTS первый заход по http:// перехватчик подменил бы
    # ответом со своим файлом — первую установку подпись не защищает.
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 512;

    # Тел запросов мы не принимаем вовсе: всё общение — GET.
    client_max_body_size 1k;
    limit_req_status 429;
    limit_conn_status 429;

    # Файл приложения: раздаёт nginx напрямую, службе такое ни к чему.
    location /download/ {
        # В день раздачи вся группа качает из-за одного адреса оператора:
        # десяти одновременных мало. А объём одного
        # скрипта с одним соединением в цикле ограничивал только канал машины:
        # теперь скорость на соединение и частота по адресу.
        limit_conn whensclass_apk 30;
        limit_req zone=whensclass_apk_req burst=30 nodelay;
        limit_rate 1m;

        # По ссылкам — только если у ссылки и цели один владелец: latest.apk
        # (root) ведёт на сборку (root), а ссылку, подложенную службой, на
        # чужой файл nginx не раскроет.
        disable_symlinks if_not_owner from=/var/lib/whensclass/apk;

        alias /var/lib/whensclass/apk/;
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
        # Свой add_header в location отменяет серверный — повторить.
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Страница на корне домена: её nginx отдаёт сам, до службы она не доходит.
    location = / {
        limit_req zone=whensclass_api burst=60 nodelay;
        root /opt/whensclass/server/deploy/site;
        try_files /index.html =404;
    }

    location / {
        limit_req zone=whensclass_api burst=60 nodelay;
        # Служба отвечает только на GET. Всё остальное отсекаем здесь, не доводя
        # до неё: она живёт в одном процессе, и занимать его незачем.
        limit_except GET HEAD { deny all; }

        proxy_pass http://unix:/run/whensclass/api.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
