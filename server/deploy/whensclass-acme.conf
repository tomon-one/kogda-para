# Временный конфиг — только на первый сертификат на чистой машине.
#
# whensclass.conf ссылается на сертификат, которого до certbot ещё нет, и
# `nginx -t` его не пропускает, а порт 80 для проверки владения доменом лежит
# в том же файле. Поэтому сначала — этот файл,
# certbot, и только потом полный конфиг вместо него (руководство по серверу, «nginx и
# сертификат»). На vs-new не нужен: сертификат там уже есть.
server {
    listen 80;
    server_name kogda-para-nsk.ru schedule.edelweiss-alpine-confederation.ru;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 404; }
}
