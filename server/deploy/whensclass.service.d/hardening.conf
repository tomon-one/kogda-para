# /etc/systemd/system/whensclass.service.d/hardening.conf — ставит владелец.
# Второй аудит, прогон 1 (23 сентября 2026).
[Service]
# Unix-сокет вместо 127.0.0.1:8081: порт на общей машине могла занять любая
# локальная учётка, пока служба перезапускается (В23). Каталог /run/whensclass
# создаёт systemd и отдаёт службе; nginx заходит в него на чтение (0755), а
# сокет uvicorn делает 0666.
ExecStart=
ExecStart=/opt/whensclass/.venv/bin/uvicorn whensclass.main:app --uds /run/whensclass/api.sock --workers 1 --no-access-log --no-proxy-headers
RuntimeDirectory=whensclass
RuntimeDirectoryMode=0755
# Раздаваемые сборки служба только читает (В24): описание сборки и сами файлы
# кладёт tools/publish_apk.py от root.
ReadOnlyPaths=/var/lib/whensclass/apk
