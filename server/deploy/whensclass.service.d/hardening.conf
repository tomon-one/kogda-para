# /etc/systemd/system/whensclass.service.d/hardening.conf — ставит владелец.
# С 23 сентября 2026.
[Unit]
# Сокет держит systemd (whensclass.socket), служба получает его готовым.
Requires=whensclass.socket
After=whensclass.socket

[Service]
# Unix-сокет вместо 127.0.0.1:8081: порт на общей машине могла занять любая
# локальная учётка, пока служба перезапускается. С 29.09 сокет создаёт и держит
# systemd (whensclass.socket, 0660, группа whensclass — в ней пользователь
# nginx), uvicorn берёт его третьим дескриптором. Раньше сокет делал uvicorn,
# открытым всем (0666), и закрывал его каталог 0750; на перезапуске каталог
# оставался только ради Python 3.12 (руководство по серверу, «Сокет службы»).
ExecStart=
ExecStart=/opt/whensclass/.venv/bin/uvicorn whensclass.main:app --fd 3 --workers 1 --no-access-log --no-proxy-headers
# Раздаваемые сборки служба только читает: описание сборки и сами файлы
# кладёт скрипт выкладки от root.
# «-»: каталога apk/ нет до первой выкладки сборки, и без минуса служба на
# чистой машине не стартовала — 226/NAMESPACE.
ReadOnlyPaths=-/var/lib/whensclass/apk
# Файлы состояния — только службе: в push.json адреса подписок и их ключи, а
# машина общая; при UMask 0022 их читала бы любая учётка. Каталог — 0750,
# nginx в группе whensclass проходит к apk/.
UMask=0077
# Потолок потоков: повторы уведомлений заводили по потоку на каждый, и при
# массовой неудаче служба упиралась бы в MemoryMax (повторы идут очередью,
# это — страховка).
TasksMax=256

# Узкий профиль процесса: служба разбирает
# сетевой ввод, и если её всё же захватят, пусть это будет процесс без
# лишних семейств адресов, системных вызовов и чужих процессов в /proc.
# Только то, что не мешает Python, uvicorn и httpx; PrivateUsers и
# ProcSubset не ставим — первое путает группу сокета для nginx, второе
# прячет /proc/meminfo, который читают библиотеки.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallFilter=@system-service
SystemCallArchitectures=native
CapabilityBoundingSet=
ProtectProc=invisible
ProtectClock=yes
ProtectHostname=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes

