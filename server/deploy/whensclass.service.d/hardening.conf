# /etc/systemd/system/whensclass.service.d/hardening.conf — ставит владелец.
# С 23 сентября 2026.
[Service]
# Unix-сокет вместо 127.0.0.1:8081: порт на общей машине могла занять любая
# локальная учётка, пока служба перезапускается. Каталог /run/whensclass
# создаёт systemd и отдаёт службе. Сокет uvicorn делает 0666, и при каталоге
# 0755 к службе мимо nginx — мимо лимитов, размера запроса и таймаутов —
# подключалась любая учётка машины. Каталог
# 0750: войти в него может только группа whensclass, а в ней — пользователь
# nginx (docs/deploy.md, «Сокет службы»).
ExecStart=
ExecStart=/opt/whensclass/.venv/bin/uvicorn whensclass.main:app --uds /run/whensclass/api.sock --workers 1 --no-access-log --no-proxy-headers
RuntimeDirectory=whensclass
RuntimeDirectoryMode=0750
# Каталог сокета переживает перезапуск: без него systemd стирал сокет, и пока
# новый процесс поднимался, nginx получал ENOENT и писал в журнал ошибок
# уровня crit адрес телефона вместе со строкой запроса. С сокетом на месте nginx получает отказ соединения — уровня
# error, в журнал он не идёт.
RuntimeDirectoryPreserve=restart
# Раздаваемые сборки служба только читает: описание сборки и сами файлы
# кладёт tools/publish_apk.py от root.
# «-»: каталога apk/ нет до первой выкладки сборки, и без минуса служба на
# чистой машине не стартовала — 226/NAMESPACE.
ReadOnlyPaths=-/var/lib/whensclass/apk

# Узкий профиль процесса: служба разбирает
# сетевой ввод, и если её всё же захватят, пусть это будет процесс без
# лишних семейств адресов, системных вызовов и чужих процессов в /proc.
# Только то, что не мешает Python, uvicorn и httpx; PrivateUsers и
# ProcSubset не ставим — первое путает группу сокета для nginx, второе
# прячет /proc/meminfo, который читают библиотеки.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallFilter=@system-service
SystemCallArchitectures=native
CapabilityBoundingSet=
ProtectProc=invisible
ProtectClock=yes
ProtectHostname=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes

