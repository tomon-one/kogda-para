[project]
name = "whensclass"
version = "0.1.0"
description = "Разбор расписания НГОК из Google Sheets и компактный JSON для виджета"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "apscheduler>=3.10",
    # Уведомления сайта: шифрование Web Push и подпись VAPID (push/webpush.py).
    "cryptography>=44",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
# Точно, а не «не ниже»: pip собирает editable-установку в отдельном окружении
# из PyPI, и constraints.txt туда не доходит — на каждой выкладке под root
# ставилась и исполнялась самая свежая версия.
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: работает по полному листу в 820 КБ"]

[tool.ruff]
line-length = 95

[tool.ruff.lint]
ignore = [
    # Фоновые циклы службы ловят всё: упавший обход не должен остановить службу.
    "BLE001",
    # Вложенная функция зовётся в том же шаге цикла, а не после него.
    "B023",
    # Поддельные ответы в тестах — классы с полями-словарями, не изменяются.
    "RUF012",
    # Два вложенных with читаются проще одного длинного.
    "SIM117",
]
